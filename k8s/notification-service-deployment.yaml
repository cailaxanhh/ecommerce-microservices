# Consumer note: notification-service includes a Kafka consumer (order-events + inventory-events).
# In production on AWS, the consumer runs as a Lambda function (notification-consumer)
# triggered by MSK event source mapping. The ECS/K8s deployment runs the full
# NestJS app including the in-process Kafka consumer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: order-platform
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: order-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: order-platform
    spec:
      containers:
        - name: notification-service
          image: order-platform-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
              name: http
          envFrom:
            - configMapRef:
                name: order-platform-config
            - secretRef:
                name: order-platform-secrets
          env:
            - name: PORT
              value: "3006"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: order-platform
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: order-platform
spec:
  type: ClusterIP
  ports:
    - port: 3006
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notification-service
