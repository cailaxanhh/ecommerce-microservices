apiVersion: v1
kind: ConfigMap
metadata:
  name: order-platform-config
  namespace: order-platform
  labels:
    app.kubernetes.io/part-of: order-platform
data:
  NODE_ENV: production
  PORT: "3000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: order_platform
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKERS: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
  KAFKA_CLIENT_ID: order-platform
  ORDER_TOPIC: order-events
  INVENTORY_TOPIC: inventory-events
  PAYMENT_TOPIC: payment-events
  LOG_LEVEL: info
