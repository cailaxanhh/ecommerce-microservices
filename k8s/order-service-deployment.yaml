# Consumer note: order-service includes a Kafka consumer (inventory-consumer).
# In production on AWS, the consumer runs as a Lambda function (order-consumer)
# triggered by MSK event source mapping. The ECS/K8s deployment runs the full
# NestJS app including both the REST API and the in-process Kafka consumer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-platform
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: order-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: service
        app.kubernetes.io/part-of: order-platform
    spec:
      containers:
        - name: order-service
          image: order-platform-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
              name: http
          envFrom:
            - configMapRef:
                name: order-platform-config
            - secretRef:
                name: order-platform-secrets
          env:
            - name: PORT
              value: "3003"
            - name: USER_SERVICE_URL
              value: "http://user-service:3001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3002"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order-platform
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: order-platform
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: order-service
