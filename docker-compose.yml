# Order Platform — development infrastructure
#
# Postgres (one database per service), Redis, Kafka, Zookeeper.
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#
# Each service reads its DB_* env vars from its own .env (see .env.example
# in every service folder). For local development with dockerized infra the
# DB_HOST should be `localhost` (port-forwarded below) and DB_USER/PASSWORD
# should match what's configured here (postgres / postgres default).
version: "3.8"

services:
  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL — one logical database per service (single server, 6 DBs)
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: order-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Create the databases on first boot
      POSTGRES_MULTIPLE_DATABASES: user_service,product_service,order_service,payment_service,inventory_service,notification_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # Redis — caching, idempotency keys, rate limiting, dedup
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: order-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────
  # Zookeeper (required by Kafka)
  # ─────────────────────────────────────────────────────────────────────
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: order-platform-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"

  # ─────────────────────────────────────────────────────────────────────
  # Kafka — separate topics: order-events, payment-events, inventory-events
  # ─────────────────────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: order-platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics.sh",
          "--list",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 8

  # ─────────────────────────────────────────────────────────────────────
  # Kafka topics initialization (order-events / payment-events / inventory-events)
  # ─────────────────────────────────────────────────────────────────────
  kafka-init:
    image: bitnami/kafka:3.7
    container_name: order-platform-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 \
          --topic order-events --partitions 3 --replication-factor 1
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 \
          --topic payment-events --partitions 3 --replication-factor 1
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 \
          --topic inventory-events --partitions 3 --replication-factor 1
        echo "Kafka topics ready."

  # ─────────────────────────────────────────────────────────────────────
  # PgAdmin (optional) — view the databases in a browser
  # ─────────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: order-platform-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
